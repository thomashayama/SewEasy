<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SewEasy · Agent render</title>
<style>
:root{color-scheme:light dark;font:15px system-ui;background:#f1f0eb;color:#243b40}body{margin:0}header{display:flex;align-items:center;gap:20px;padding:20px 28px;border-bottom:1px solid #7893}a{color:inherit}header a:first-child{font-weight:650;text-decoration:none;margin-right:auto}main{max-width:1000px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,384px) minmax(0,1fr);gap:24px}canvas{width:384px;height:448px;max-width:100%;border-radius:12px}img{width:100%;height:448px;object-fit:contain;background:#fff;border-radius:12px}p{line-height:1.5}#status{min-height:42px}progress{width:100%;accent-color:#386b6b}button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #7895;cursor:pointer;background:transparent;color:inherit}@media(prefers-color-scheme:dark){:root{background:#171e22;color:#dce4e6}}@media(max-width:680px){main{grid-template-columns:1fr}header{padding:16px}canvas{display:block;margin:auto}}
</style></head><body><header><a href="/">SewEasy</a><a id="svg-link">Download SVG</a><a id="png-link">Download PNG</a></header>
<main><section aria-label="3D render"><canvas id="render" aria-label="Garment on the default mannequin"></canvas><p id="status" role="status">Preparing preview…</p><progress id="progress" max="180" value="0"></progress><button id="retry" hidden>Retry 3D render</button></section><section><img id="pattern" alt="2D sewing pattern"><p>Rendered on the default mannequin. The cloth simulation runs in this browser. Finished thumbnails are saved to the original garment or outfit.</p></section></main>
<script type="module" src="/agent-assets/agent_viewer.js"></script></body></html>
